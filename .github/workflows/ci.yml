name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege by default; only the release job can write.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine version
        id: ver
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            grep -q "^## $VERSION " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $VERSION' entry"; exit 1; }
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          [[ "$VERSION" =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "::error::invalid version '$VERSION'"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build universal binary
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          make VERSION="$VERSION"
          lipo -archs sidebarctl | grep -q "x86_64 arm64"
          ./sidebarctl version
          ./sidebarctl help >/dev/null

      - name: Smoke test (best effort; depends on the runner's Finder session)
        continue-on-error: true
        run: make test

      - name: Package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          make dist VERSION="$VERSION"
          (cd dist && shasum -a 256 -c ./*.sha256)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "sidebarctl $GITHUB_REF_NAME" --generate-notes --verify-tag
